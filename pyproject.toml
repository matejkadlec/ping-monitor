[project]
name = "ping-monitor"
version = "2.0.0"
description = "Windows ping monitor with a modern PySide6 UI and a tray status icon"
requires-python = ">=3.14"
dependencies = [
    "PySide6-Essentials>=6.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
