# Builds PingMonitor.exe on Windows, starts it once as a smoke test and puts it
# on the draft release "exe-latest" (only visible to the repository owner until
# published) and on the run as an artifact.
name: Build PingMonitor.exe

on:
  push:
    branches: [master, pyside6-redesign]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build
        shell: cmd
        run: |
          call build.bat > build-log.txt 2>&1
          set CODE=%ERRORLEVEL%
          type build-log.txt
          exit /b %CODE%

      - name: Smoke test (start it, let it ping for 25 s)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "ping-monitor-data"
          $env:PING_MONITOR_DATA_DIR = $data
          $process = Start-Process -FilePath "dist\PingMonitor.exe" -PassThru
          Start-Sleep -Seconds 25
          $log = Join-Path $data "app.log"
          $alive = -not $process.HasExited
          if ($alive) { taskkill /PID $process.Id /T /F | Out-Null }
          Start-Sleep -Seconds 2
          "alive after 25 s: $alive" | Out-File smoke-log.txt
          if (Test-Path $log) { Get-Content $log | Out-File smoke-log.txt -Append }
          Get-ChildItem $data -ErrorAction SilentlyContinue | Out-File smoke-log.txt -Append
          Get-Content smoke-log.txt
          if (-not $alive) { throw "PingMonitor.exe exited early (code $($process.ExitCode))" }
          if (-not (Test-Path $log)) { throw "app.log was not written" }
          if (Select-String -Path $log -Pattern "Traceback" -Quiet) { throw "app.log contains a traceback" }

      - uses: actions/upload-artifact@v4
        with:
          name: PingMonitor
          path: dist/PingMonitor.exe

      - name: Update the draft release
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "exe-latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "PingMonitor.exe (latest build)" `
              --notes "Built automatically from the newest push. Draft: publish it to share the .exe."
          }
          $files = @("build-log.txt", "smoke-log.txt", "dist/PingMonitor.exe") | Where-Object { Test-Path $_ }
          gh release upload $tag @files --clobber
          gh release edit $tag --draft=true --target $env:GITHUB_SHA --notes "Built from $env:GITHUB_SHA ($env:GITHUB_REF_NAME), job status: ${{ job.status }}."
